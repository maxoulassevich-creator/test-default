<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 660" width="430" height="660" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Dark background with a grid dissolving into solid colour">
  <defs>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none"
            stroke="#f2f2f2" stroke-opacity="0.11" stroke-width="1"/>
    </pattern>

    <radialGradient id="fade" gradientUnits="userSpaceOnUse"
                    cx="215.0" cy="13.200000000000001" r="326.8"
                    gradientTransform="translate(215.0 13.200000000000001) scale(1 0.88) translate(-215.0 -13.200000000000001)">
      <stop offset="0%"   stop-color="#fff" stop-opacity="1"/>
      <stop offset="45%"  stop-color="#fff" stop-opacity="0.82"/>
      <stop offset="72%"  stop-color="#fff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>

    <mask id="gridMask">
      <rect width="430" height="660" fill="url(#fade)"/>
    </mask>

    <!-- Resolves the whole frame back into the flat base colour, so the bottom
         edge is exactly #141414 and joins the next section with no seam. -->
    <linearGradient id="settle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141414" stop-opacity="0"/>
      <stop offset="42%"  stop-color="#141414" stop-opacity="0.12"/>
      <stop offset="70%"  stop-color="#141414" stop-opacity="0.48"/>
      <stop offset="88%"  stop-color="#141414" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#141414" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <rect width="430" height="660" fill="#141414"/>
  <rect width="430" height="660" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="430" height="660" fill="url(#settle)"/>
</svg>
