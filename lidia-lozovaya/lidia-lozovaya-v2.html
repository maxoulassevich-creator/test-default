/* ==================================================================
   Visual: акварельные пятна, обложки произведений, пейзаж «окна»
   по времени суток, портрет-заглушка, миниатюры для поиска.
   Цвета пятен заданы через CSS-переменные (style="fill:var(--…)"),
   поэтому сами перекрашиваются при смене темы.
   ================================================================== */
const Visual = (() => {
  const { esc, t } = App;
  const n1 = v => Math.round(v * 10) / 10;
  const R = seed => Content.rng(String(seed));

  function blobPath(r, cx, cy, rad, pts = 9, jit = .26, squash = 1) {
    const P = [], off = r() * Math.PI * 2;
    for (let i = 0; i < pts; i++) {
      const a = off + i / pts * Math.PI * 2, k = 1 - jit + r() * jit * 2;
      P.push([cx + Math.cos(a) * rad * k, cy + Math.sin(a) * rad * k * squash * (.85 + r() * .3)]);
    }
    return Content.smooth(P, true);
  }

  /** Акварельное пятно: несколько полупрозрачных слоёв и тёмная кромка, как у высохшей краски. */
  function blob(seed, color, { filter = 'wc', layers = 3, edge = true, view = 400 } = {}) {
    const r = R(seed);
    let g = '';
    for (let i = 0; i < layers; i++) {
      const cx = view * (.36 + r() * .28), cy = view * (.36 + r() * .28), rad = view * (.2 + r() * .15);
      g += `<path d="${blobPath(r, cx, cy, rad)}" style="fill:${color}" fill-opacity="${(.32 + r() * .32).toFixed(2)}"/>`;
    }
    if (edge) g += `<path d="${blobPath(r, view * .5, view * .5, view * .31, 11, .18)}" fill="none" style="stroke:${color}" stroke-opacity=".55" stroke-width="2.4"/>`;
    return `<svg viewBox="0 0 ${view} ${view}" preserveAspectRatio="none" aria-hidden="true" focusable="false"><g filter="url(#${filter})">${g}</g></svg>`;
  }
  /** Картина «под обрез» — для круглых обложек песен и плеера (полный вид картины — без обрезки, ТЗ 5.6). */
  const fill = svg => svg.replace('xMidYMid meet', 'xMidYMid slice');
  const washOf = type => `var(--w-${['prose', 'poem', 'song', 'painting', 'play', 'script'].includes(type) ? type : 'media'})`;

  /* ---------- обложки ---------- */
  const KIND = { prose: w => w.kind || 'Проза', poem: () => 'Стихотворение', play: () => 'Пьеса', script: () => 'Сценарий', song: () => 'Песня' };
  function cover(w, { ratio, size = '' } = {}) {
    if (!w) return '';
    const type = w.type;
    if (type === 'painting') {
      return `<div class="cv cv--painting ${size}" style="${ratio ? `aspect-ratio:${ratio}` : ''}"><div class="cv__mat">${Art.painting(w, { decorative: true })}</div></div>`;
    }
    if (type === 'song') {
      const c = w.cover && Content.byId(w.cover);
      return `<div class="cv cv--song ${size}" data-pig="song"><div class="cv__disc">${c ? fill(Art.painting(c, { decorative: true })) : blob(w.id, washOf('song'))}<i></i></div></div>`;
    }
    const r = R(w.id);
    const wash = `<div class="cv__wash" style="--x:${n1(r() * 40 - 10)}%;--y:${n1(r() * 30 - 10)}%;--rot:${n1(r() * 50 - 25)}deg">${blob(w.id, washOf(type), { layers: 3 })}</div>`;
    const kind = esc(t(KIND[type] ? KIND[type](w) : ''));
    const gl = `<span class="cv__gl">${App.glyph(type)}</span>`;
    if (type === 'poem') {
      const lines = (w.firstLines || []).slice(0, 2).map(esc).join('<br>');
      return `<div class="cv cv--poem ${size}" data-pig="poem" style="${ratio ? `aspect-ratio:${ratio}` : ''}">${wash}<span class="cv__kind">${esc((Content.cycleOf(w.cycle) || {}).title || kind)}</span><p class="cv__lines">${lines}</p><span class="cv__title">${esc(w.title)}</span>${gl}</div>`;
    }
    if (type === 'script') {
      return `<div class="cv cv--script ${size}" data-pig="script" style="${ratio ? `aspect-ratio:${ratio}` : ''}">${wash}<span class="cv__kind">${kind}</span><span class="cv__title">${esc(w.title)}</span><span class="cv__sub">${esc(w.status || '')}</span><span class="cv__foot">${esc(w.runtime || '')}</span>${gl}</div>`;
    }
    if (type === 'play') {
      return `<div class="cv cv--play ${size}" data-pig="play" style="${ratio ? `aspect-ratio:${ratio}` : ''}"><div class="cv__spot"></div>${wash}<span class="cv__kind">${kind}</span><span class="cv__title">${esc(w.title)}</span><span class="cv__sub">${esc(w.subtitle || '')}</span>${gl}</div>`;
    }
    return `<div class="cv cv--prose ${size}" data-pig="prose" style="${ratio ? `aspect-ratio:${ratio}` : ''}">${wash}<span class="cv__kind">${kind}</span><span class="cv__title">${esc(w.title)}</span><span class="cv__sub">${esc(w.subtitle || '')}</span><span class="cv__foot">${esc(t('Лидия Лозовая'))}</span>${gl}</div>`;
  }

  /** Миниатюра элемента поиска/ленты: обложка, фото альбома или кадр видео. */
  function thumb(it, { ratio = '4/5' } = {}) {
    if (!it) return '';
    if (it.kind === 'work') return cover(it.ref, { ratio });
    const src = it.kind === 'album' ? it.ref.photos[0] : it.ref;
    const [rw, rh] = String(ratio).split('/').map(Number);
    return `<div class="cv cv--photo" style="aspect-ratio:${ratio}">${Photo.svg(src, { w: 400, h: Math.round(400 * rh / rw), label: it.title })}${it.kind === 'video' ? `<span class="cv__play">${App.icon('play')}</span>` : ''}</div>`;
  }

  /* ---------- «окно» на главной: пейзаж по времени суток ---------- */
  const SKY = {
    morning: { sky: ['#C7D5DC', '#EBD8C3', '#F7E5CB'], sun: '#FFF3DA', glow: '#FBE3B8', sunAt: [.28, .5], sunR: 34, hills: '#B4AC8A', river: ['#E6E2D6', '#BFC9C8'], ground: ['#B3A574', '#857850'], cloud: '#FFFFFF', mist: true },
    day: { sky: ['#9FBBD0', '#CFDDE2', '#EEE6D2'], sun: '#FFFBEF', glow: '#FFF3D0', sunAt: [.68, .2], sunR: 28, hills: '#9FA078', river: ['#A7BEC7', '#7D98A6'], ground: ['#C8A35C', '#8C7340'], cloud: '#FFFFFF', birds: true },
    evening: { sky: ['#56567A', '#C77B68', '#F2B37A'], sun: '#FAD08A', glow: '#F29A5E', sunAt: [.66, .53], sunR: 44, hills: '#6B5360', river: ['#E2A274', '#8C5A55'], ground: ['#5C4744', '#3A2D2C'], cloud: '#F5C9A0', boat: true },
    night: { sky: ['#0F1628', '#1E2B48', '#38436A'], sun: '#F4EBD5', glow: '#8B97C4', sunAt: [.72, .18], sunR: 22, hills: '#1B2236', river: ['#2E3B5C', '#1A2338'], ground: ['#131827', '#0B0F19'], cloud: '#55608A', stars: true, house: true }
  };
  function hero(tod) {
    const P = SKY[tod] || SKY.day, W = 600, H = 760, r = R('hero-' + tod), id = 'hz-' + tod;
    const hz = H * .6, [sx, sy] = [P.sunAt[0] * W, P.sunAt[1] * H];
    const band = (y0, amp, seed) => { const rr = R(seed); let d = `M-20 ${n1(y0)}`; for (let x = 0; x <= W + 40; x += 60) d += ` Q${n1(x + 30)} ${n1(y0 - amp * (rr() - .3))} ${n1(x + 60)} ${n1(y0 + amp * (rr() - .5) * .6)}`; return d + ` V${H + 20} H-20Z`; };
    let stars = '';
    if (P.stars) for (let i = 0; i < 46; i++) stars += `<circle cx="${n1(r() * W)}" cy="${n1(r() * hz * .8)}" r="${n1(.6 + r() * 1.3)}" fill="#F4EBD5" opacity="${(.35 + r() * .6).toFixed(2)}" class="${i % 5 ? '' : 'tw'}"/>`;
    let grass = '';
    for (let i = 0; i < 70; i++) { const x = r() * W, y = H * .8 + r() * H * .2, l = 10 + r() * 22; grass += `<path d="M${n1(x)} ${n1(y)}q${n1(r() * 6 - 3)} ${n1(-l / 2)} ${n1(r() * 8 - 4)} ${n1(-l)}"/>`; }
    let shimmer = '';
    for (let i = 0; i < 16; i++) { const y = hz + 22 + i * 7 + r() * 4, w = 14 + (16 - i) * 4 * r(); shimmer += `<path d="M${n1(sx - w / 2 + (r() - .5) * 12)} ${n1(y)}h${n1(w)}"/>`; }
    const clouds = [0, 1, 2].map(i => `<g class="hz-cloud hz-cloud--${i}" style="opacity:${(.35 + r() * .3).toFixed(2)}"><path d="${blobPath(r, W * (.15 + i * .33), H * (.12 + r() * .18), 70 + r() * 40, 9, .3, .38)}" fill="${P.cloud}" filter="url(#wc-soft)"/></g>`).join('');
    return `<svg class="hz" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(t({ morning: 'Утро над рекой', day: 'День в степи', evening: 'Вечер у переправы', night: 'Ночь, свет в окне' }[tod]))}">
      <defs><linearGradient id="${id}-s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.sky[0]}"/><stop offset=".55" stop-color="${P.sky[1]}"/><stop offset="1" stop-color="${P.sky[2]}"/></linearGradient>
        <radialGradient id="${id}-g"><stop offset="0" stop-color="${P.glow}" stop-opacity=".9"/><stop offset="1" stop-color="${P.glow}" stop-opacity="0"/></radialGradient>
        <linearGradient id="${id}-r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P.river[0]}"/><stop offset="1" stop-color="${P.river[1]}"/></linearGradient>

          <p>${esc(w.excerpt)}</p><p class="meta">${esc(meta(w))}</p>
          ${w.chapters.length > 1 ? `<ol class="book__toc">${w.chapters.map((ch, i) => `<li><a href="${Works.chapterUrl(w, i + 1)}"><i>${i + 1}</i>${esc(ch.title)}</a></li>`).join('')}</ol>` : ''}

  function proseWork(w, q) {

    let found = '';

      found = `<div class="infind" aria-live="polite">${hits.length ? `<p class="meta">${esc(t('Найдено в главах'))}: ${hits.length}</p><ul>${hits.map(h => `<li><a href="${Works.chapterUrl(w, h.i + 1)}?q=${encodeURIComponent(q.q)}"><b>${esc(t('Глава'))} ${h.i + 1}. ${esc(w.chapters[h.i].title)}</b><span>${h.sn}</span></a></li>`).join('')}</ul>` : `<p class="meta">${esc(t('В этой книге таких слов нет.'))}</p>`}</div>`;
    }
    return `<div class="wrap page" data-pig="prose">
      ${crumbs([home(), artC(), { label: t('Проза'), href: '#/prose' }, { label: w.title }])}
      <section class="wk-hero">

          <h1 class="display">${esc(w.title)}</h1>${w.subtitle ? `<p class="lead">${esc(w.subtitle)}</p>` : ''}
          ${w.dedication ? `<p class="dedication">${esc(w.dedication)}</p>` : ''}
          ${w.epigraph ? `<blockquote class="epigraph"><p>${esc(w.epigraph.text)}</p>${w.epigraph.cite ? `<cite>${esc(w.epigraph.cite)}</cite>` : ''}</blockquote>` : ''}
          <p class="wk-hero__ann">${esc(w.excerpt)}</p>
          ${facts([['Год', w.year], ['Место', esc(w.place || '')], ['Глав', w.chapters.length], ['Время чтения', '≈ ' + esc(minLabel(minutes(w.words)))]])}
          <div class="row"><a class="btn btn--pig" href="${resume ? esc(resume.href) : Works.chapterUrl(w, 1)}">${resume ? `${esc(t('Продолжить'))}: ${esc(resume.sub || '')}` : esc(t('Начать читать'))} ${icon('arrow-right')}</a>${resume ? `<a class="btn btn--ghost" href="${Works.chapterUrl(w, 1)}">${esc(t('С начала'))}</a>` : ''}</div>
        </div>
      </section>
      <section class="sec toc" aria-labelledby="toc-h">
        <div class="sec__head"><h2 class="h2" id="toc-h">${esc(t('Оглавление'))}</h2>
          <form class="infind__form" data-form="infind" role="search"><label class="sr-only" for="inq">${esc(t('Найти в тексте'))}</label>${icon('search')}<input class="input" id="inq" name="q" type="search" value="${esc(q.q || '')}" placeholder="${esc(t('Найти в этой книге'))}"></form></div>
        ${found}
        <ol class="toc__list">${w.chapters.map((ch, i) => { const paras = C.parasOf(ch.text); const mins = minutes(C.wordCount(ch.text)); return `<li data-reveal style="--d:${i}"><a class="toc__a ${resume && resume.n === i + 1 ? 'is-last' : ''}" href="${Works.chapterUrl(w, i + 1)}"><i>${i + 1}</i><span><b>${esc(ch.title)}</b><small>${esc(paras[0].slice(0, 120))}…</small></span><em>${esc(minLabel(mins))}${resume && resume.n === i + 1 ? ` · ${esc(t('вы здесь'))}` : ''}</em></a></li>`; }).join('')}</ol>
      </section>
      <div class="wk-foot">${tags(w)}${App.share(w.title)}</div>
      ${related(w)}
    </div>`;
  }
  const READ = () => App.store.json('ll2-read', { size: 2, lead: 0, bg: 'paper' });
  function readerStyle() { const r = READ(); return `--rs:${[17, 18.5, 20, 21.5, 23][r.size]}px;--rl:${r.lead ? 1.95 : 1.72}`; }
  function proseChapter(w, n, q) {
    const ch = w.chapters[n - 1]; if (!ch) return null;
    const terms = q.q ? C.termsOf(q.q) : [], counter = { n: 0 };
    const paras = C.parasOf(ch.text).map(p => `<p>${C.hl(p, terms, counter)}</p>`).join('');
    const total = w.chapters.length, mins = minutes(C.wordCount(ch.text)), r = READ();
    const prev = n > 1 ? { href: Works.chapterUrl(w, n - 1), k: t('Предыдущая глава'), t: w.chapters[n - 2].title } : null;
    const next = n < total ? { href: Works.chapterUrl(w, n + 1), k: t('Следующая глава'), t: w.chapters[n].title } : null;
    return `<div class="reader" data-pig="prose" data-rbg="${r.bg}" style="${readerStyle()}">
      <div class="read page">
        ${crumbs([home(), { label: t('Проза'), href: '#/prose' }, { label: w.title, href: Works.url(w) }, { label: `${t('Глава')} ${n}` }])}
        <div class="rtools" role="toolbar" aria-label="${esc(t('Настройки чтения'))}">
          <button class="chip chip--nodot" type="button" data-act="toc">${icon('list')}${esc(t('Оглавление'))}</button>
          <div class="rtools__grp" role="group" aria-label="${esc(t('Размер текста'))}"><button class="ibtn" type="button" data-rs="-1" aria-label="${esc(t('Меньше'))}">${icon('minus')}</button><span>${icon('type')}</span><button class="ibtn" type="button" data-rs="1" aria-label="${esc(t('Больше'))}">${icon('plus')}</button></div>
          <button class="chip chip--nodot ${r.lead ? 'is-on' : ''}" type="button" data-rl aria-pressed="${!!r.lead}">${esc(t('Интервал'))}</button>
          <div class="rtools__grp" role="group" aria-label="${esc(t('Фон'))}">${[['paper', 'Бумага'], ['sepia', 'Сепия'], ['night', 'Ночь']].map(([k, l]) => `<button class="rbg rbg--${k}" type="button" data-rbg="${k}" aria-pressed="${r.bg === k}" title="${esc(t(l))}"><span class="sr-only">${esc(t(l))}</span></button>`).join('')}</div>
        </div>
        <header class="chap__head"><p class="kicker">${esc(w.title)} · ${esc(t('Глава'))} ${n} ${esc(t('из'))} ${total}</p><h1 class="display">${esc(ch.title)}</h1><p class="meta">≈ ${esc(minLabel(mins))}</p></header>
        ${q.q ? `<div class="hits" role="status">${esc(t('Найдено'))}: ${counter.n} «${esc(q.q)}» ${counter.n ? `<button class="chip chip--nodot" type="button" data-act="next-hit">${esc(t('Следующее'))} ${icon('arrow-right')}</button>` : ''}<a class="chip chip--nodot" href="${Works.chapterUrl(w, n)}">${icon('close')}${esc(t('Убрать подсветку'))}</a></div>` : ''}
        <article class="ptext">${paras}</article>
        <div class="chap__end" aria-hidden="true">${App.glyph('prose')}</div>
        ${pager(prev, next, t('Главы'))}
        <div class="row row--center"><a class="btn btn--ghost" href="${Works.url(w)}?at=toc-h">${icon('list')} ${esc(t('Ко всем главам'))}</a></div>
      </div></div>`;
  }
  function chapterMount(root, w, n) {
    const href = Works.chapterUrl(w, n);
    const saved = Reading.last();
    Reading.save({ id: w.id, type: 'prose', href, n, title: w.title, sub: `${t('Глава')} ${n}: ${w.chapters[n - 1].title}`, ratio: saved && saved.href === href ? saved.ratio : 0 });
    App.chrome();
    // предложить вернуться к месту, где остановились
    if (saved && saved.href === href && saved.ratio > .06 && !App.current.query.q) {
      const b = document.createElement('button'); b.className = 'jump'; b.type = 'button';
      b.innerHTML = `${icon('bookmark')}${esc(t('Вернуться к месту, где вы остановились'))}`;
      b.addEventListener('click', () => { window.scrollTo({ top: saved.ratio * (document.documentElement.scrollHeight - innerHeight), behavior: 'smooth' }); b.remove(); });
      root.querySelector('.chap__head').after(b);
    }
    let tmr;
    const onS = () => { clearTimeout(tmr); tmr = setTimeout(() => { const max = document.documentElement.scrollHeight - innerHeight; const l = Reading.last(); if (l && l.href === href) Reading.save({ ...l, ratio: max > 0 ? scrollY / max : 0 }); }, 400); };
    window.addEventListener('scroll', onS, { passive: true });
    const set = patch => { App.store.put('ll2-read', { ...READ(), ...patch }); const r = READ(); const el = root.querySelector('.reader'); el.setAttribute('style', readerStyle()); el.dataset.rbg = r.bg; root.querySelectorAll('[data-rbg]').forEach(b => b.matches('button') && b.setAttribute('aria-pressed', String(b.dataset.rbg === r.bg))); const rl = root.querySelector('[data-rl]'); rl.classList.toggle('is-on', !!r.lead); rl.setAttribute('aria-pressed', String(!!r.lead)); };
    root.addEventListener('click', e => {
      const rs = e.target.closest('[data-rs]'); if (rs) return set({ size: Math.max(0, Math.min(4, READ().size + Number(rs.dataset.rs))) });
      if (e.target.closest('[data-rl]')) return set({ lead: READ().lead ? 0 : 1 });
      const bg = e.target.closest('button[data-rbg]'); if (bg) return set({ bg: bg.dataset.rbg });
      if (e.target.closest('[data-act="toc"]')) return tocModal(w, n);
      if (e.target.closest('[data-act="next-hit"]')) { const marks = [...root.querySelectorAll('.ptext mark')]; const i = (Number(root.dataset.hit || 0)) % marks.length; marks.forEach(m => m.classList.remove('is-cur')); marks[i].classList.add('is-cur'); marks[i].scrollIntoView({ block: 'center', behavior: 'smooth' }); root.dataset.hit = i + 1; }
    });
    if (App.current.query.q) { const m = root.querySelector('.ptext mark'); if (m) setTimeout(() => { m.classList.add('is-cur'); m.scrollIntoView({ block: 'center' }); root.dataset.hit = 1; }, 60); }
    const off = keyNav(n > 1 ? Works.chapterUrl(w, n - 1) : null, n < w.chapters.length ? Works.chapterUrl(w, n + 1) : null);
    return () => { off(); window.removeEventListener('scroll', onS); };
  }
  function tocModal(w, n) {
    App.modal(`<div class="tocm" data-pig="prose"><p class="kicker">${esc(w.title)}</p><h2 class="h2">${esc(t('Оглавление'))}</h2>
      <ol class="toc__list">${w.chapters.map((ch, i) => `<li><a class="toc__a ${i + 1 === n ? 'is-last' : ''}" href="${Works.chapterUrl(w, i + 1)}" data-act="modal-close"><i>${i + 1}</i><span><b>${esc(ch.title)}</b></span><em>${i + 1 === n ? esc(t('сейчас')) : ''}</em></a></li>`).join('')}</ol></div>`, { label: t('Оглавление'), width: 620 });
  }
  App.route('prose', {
    section: 'prose', keepScroll: false,
    title: p => { const w = p[0] && C.byId(p[0]); return w ? (p[1] ? `${w.chapters[p[1] - 1]?.title || ''} · ${w.title}` : w.title) : 'Проза'; },
    render: (p, q) => { if (!p[0]) return proseList(); const w = C.byId(p[0]); if (!w || w.type !== 'prose') return null; return p[1] ? proseChapter(w, Number(p[1]), q) : proseWork(w, q); },
    mount(root, p) {
      const w = p[0] && C.byId(p[0]);
      const rp = document.getElementById('rp'); if (rp) rp.hidden = !(w && p[1]);
      if (w && p[1]) return chapterMount(root, w, Number(p[1]));
      root.querySelector('[data-form="infind"]')?.addEventListener('submit', e => { e.preventDefault(); const v = e.target.q.value.trim(); App.go(`${Works.url(w)}${v ? '?q=' + encodeURIComponent(v) : ''}`); });
    }
  });

  function poemPage(w, q) {

    return `<div class="poem-page" data-pig="poem">
      <div class="poem-page__wash drift drift--slow" aria-hidden="true">${Visual.blob('pp-' + w.id, 'var(--w-poem)')}</div>
      <div class="wrap page">
        ${crumbs([home(), { label: t('Поэзия'), href: '#/poetry' }, cyc ? { label: cyc.title, href: '#/poetry?at=cy-' + cyc.id } : null, { label: w.title }].filter(Boolean))}

  /* ================================================================

  function playText(text) {
    const inline = s => esc(s).replace(/\(([^)]+)\)/g, '<span class="rem">($1)</span>');
    return C.dedent(text).split('\n').map(raw => {
      const s = raw.trim(); if (!s) return '';
      if (s.startsWith('## ')) return `<h3 class="pl-scene">${esc(s.slice(3))}</h3>`;
      if (s.startsWith('# ')) return `<h2 class="pl-act">${esc(s.slice(2))}</h2>`;
      if (/^\(.*\)$/.test(s)) return `<p class="pl-remark">${esc(s)}</p>`;
      const m = /^([А-ЯЁA-Z][А-ЯЁA-Z .-]*[А-ЯЁA-Z]):\s*(.*)$/.exec(s);
      return m ? `<div class="pl-line"><p class="pl-who">${esc(m[1])}</p><p class="pl-say">${inline(m[2])}</p></div>` : `<p class="pl-remark">${esc(s)}</p>`;
    }).join('');
  }

  }

  function pcard(w, i = 0) {

    return [{ view: 'main', label: t(L.main), ratio }].concat((w.extra || []).map(x => { const o = typeof x === 'string' ? { view: x } : x; return { view: o.view, detail: o, label: t(L[o.view] || o.view), ratio: o.view === 'detail' ? 1 : ratio }; }));

    const img = m.el.querySelector('.vw__img'), stage = m.el.querySelector('.vw__stage');

  function topBar() {
    const r = role(), info = App.ROLE_INFO[r];
    const access = App.isOwner() ? t('видны все материалы и режимы доступа')
      : `${t('вам открыто')}: ${GUESTS.find(g => g.id === r).access.join(', ')}`;
    return `<div class="closed-top"><div class="wrap"><span>${icon('lock')}<b>${esc(t('Закрытая часть · по приглашению'))}</b></span><span>${icon('user')}${esc(t(info.name))} — ${esc(access)}</span></div></div>`;
  }
  const ROLE_ACCESS = { blog: r => r === 'guestA' || r === 'owner' };
  const deniedHtml = () => App.isGuest() || App.isOwner() ? `<div class="nf2">${glyph('script')}<h1>${esc(t('Нет доступа'))}</h1><p>${esc(t('Этот раздел не назначен вашей учётной записи.'))}</p><div class="row row--center"><a class="btn btn--fill" href="#/albums">${esc(t('Мои альбомы'))}</a></div></div>` : null;

  /* ---------- рабочий блог ---------- */
  App.route('blog', {
    access: 'guest', section: 'blog', title: 'Рабочий блог',
    render(p, q) {
      if (!ROLE_ACCESS.blog(role())) return deniedHtml();
      const fmt = q.f || '';
      const list = ENTRIES.filter(e => (!e.draft || App.isOwner()) && (!fmt || e.format === fmt));
      return `${topBar()}<div class="wrap page">
        <header class="phead2"><p class="kicker">${esc(t('Закрытый блог'))}</p><h1 class="display">${esc(t('Рабочий блог'))}</h1>
          <p class="lead">${esc(t('Дневник руководителя: заметки о работе, команде, профессии, проектах, людях и встречах.'))}</p></header>
        <div class="chips" role="group" aria-label="${esc(t('Формат'))}" style="margin-bottom:28px"><a class="chip chip--nodot ${!fmt ? 'is-on' : ''}" href="#/blog">${esc(t('Все'))}</a>${FORMATS.map(f => `<a class="chip chip--nodot ${fmt === f ? 'is-on' : ''}" href="#/blog?f=${encodeURIComponent(f)}">${esc(t(f))}</a>`).join('')}</div>
        <div class="blog">
          <ol class="entries">${list.map(e => `<li class="entry ${e.format === 'Мысль дня' ? 'entry--quote' : ''}">
              <div class="entry__meta"><span class="entry__fmt">${esc(t(e.format))}</span><span>${App.fmtDate(e.date)}</span>${App.isOwner() ? (e.draft ? `<span class="mode mode--owner">${icon('lock')}${esc(t('Черновик · только владелец'))}</span>` : modeBadge('guest', ['guestA'])) : ''}</div>
              ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}<p>${esc(e.text)}</p></li>`).join('') || `<li class="entry"><p>${esc(t('В этом формате пока нет записей.'))}</p></li>`}</ol>
          <aside style="display:grid;gap:18px;align-content:start">
            <div class="aside-card"><h2>${esc(t('Обо мне'))}</h2><p>${esc(t('Раздел заполняет владелец и сам решает, что показать приглашённым.'))}</p>
              <ul><li>${esc(t('Жизненный путь'))}</li><li>${esc(t('Карьера'))}</li><li>${esc(t('Личное кредо'))}</li><li>${esc(t('Текущая деятельность'))}</li></ul></div>
            <div class="aside-card"><h2>${esc(t('Как устроен доступ'))}</h2><p>${esc(t('Каждый гость видит только назначенные ему разделы и альбомы. Приглашение не открывает личный архив.'))}</p>
              <p style="margin:0">${esc(t('Кнопок «Поделиться» здесь нет: ссылка, открытая без прав, покажет нейтральный экран входа.'))}</p></div>
          </aside>
        </div></div>`;
    }
  });

  /* ---------- альбомы для приглашённых ---------- */
  App.route('albums', {
    access: 'guest', section: 'albums', title: 'Альбомы',
    render() {
      const vis = ALBUMS.filter(seesAlbum);
      const sections = [...new Set(vis.map(a => a.section))];
      return `${topBar()}<div class="wrap page">
        <header class="phead2"><p class="kicker">${esc(t('Закрытая часть'))}</p><h1 class="display">${esc(t('Альбомы'))}</h1>
          <p class="lead">${esc(App.isOwner() ? t('Все альбомы и права на них. Альбом может быть исключён из назначения, даже если гостю открыт весь раздел.') : t('Фотографии, которые владелец открыл для вас.'))}</p></header>
        ${sections.map(s => `<section class="sec" style="margin-top:0;margin-bottom:56px"><div class="sec__head"><h2 class="h2">${esc(t(s))}</h2></div>
          <div class="albums">${vis.filter(a => a.section === s).map(a => `<button class="acard" type="button" data-calbum="${a.id}" style="border:0;background:none;padding:0;text-align:left;width:100%">
            <div class="acard__img">${Photo.svg(a.photos[0], { label: a.title })}<span class="acard__stack">${icon('image')}${a.photos.length}</span></div>
            <h3>${esc(a.title)}</h3><p>${a.year} · ${esc(a.place)}</p>
            ${App.isOwner() ? `<p style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${a.audience.length ? modeBadge('guest', a.audience) : modeBadge('owner')}${a.excluded ? `<span class="mode">${esc(t('Исключён для'))}: ${esc(a.excluded.map(guestName).join(', '))}</span>` : ''}</p>` : ''}</button>`).join('')}</div></section>`).join('')}
      </div>`;
    },
    mount(root) {
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-calbum]'); if (!b) return;
        const a = ALBUMS.find(x => x.id === b.dataset.calbum); if (a && seesAlbum(a)) MediaUI.openPhoto(a, 0);
      });
    }
  });

  /* ---------- личный архив владельца ---------- */
  function vThumb(v) {
    if (v.scene) return Photo.svg(v, { w: 200, h: 200, label: v.title });
    return icon({ letter: 'mail', doc: 'doc', audio: 'sound', video: 'video' }[v.kind] || 'doc');
  }
  const KIND = { photo: 'Фото', letter: 'Письмо', doc: 'Документ', video: 'Видео', audio: 'Аудио' };
  function vaultList(q) {
    const sec = q.s || '', kind = q.k || '';
    const list = VAULT.filter(v => (!sec || v.section === sec) && (!kind || v.kind === kind));
    return `<div class="vfilters">
        <label class="field"><span>${esc(t('Раздел'))}</span><select class="select" data-vf="s"><option value="">${esc(t('Все'))}</option>${['Работа', 'Личное', 'Семья'].map(s => `<option ${s === sec ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="field"><span>${esc(t('Тип'))}</span><select class="select" data-vf="k"><option value="">${esc(t('Все'))}</option>${Object.entries(KIND).map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${esc(t(l))}</option>`).join('')}</select></label>
        <button class="btn btn--sm" type="button" data-act="v-upload">${icon('plus')}${esc(t('Добавить материал'))}</button></div>
      <ul class="vlist">${list.map(v => `<li class="vitem"><div class="vitem__thumb">${vThumb(v)}</div>
        <div><h3>${esc(v.title)}</h3><p>${esc(t(KIND[v.kind]))} · ${esc(App.fmtDate(v.date))} · ${esc(t(v.section))} · ${esc(v.event)}</p></div>
        <div class="vitem__mode">${modeBadge(v.mode, v.guests)}</div>
        <div class="vitem__act">${v.mode === 'owner' ? `<button class="btn btn--sm" type="button" data-share="${v.id}">${esc(t('Открыть доступ…'))}</button>` : `<button class="btn btn--sm btn--ghost" type="button" data-unshare="${v.id}">${esc(t('Закрыть доступ'))}</button>`}</div></li>`).join('')}</ul>`;
  }
  function timeline() {
    const items = [...VAULT.map(v => ({ y: String(v.date).slice(0, 4), d: v.date, title: v.title, kind: t(KIND[v.kind]), ev: v.event })),
      ...ALBUMS.map(a => ({ y: String(a.year), d: String(a.year), title: a.title, kind: t('Альбом'), ev: a.section }))];
    const years = [...new Set(items.map(i => i.y))].sort((a, b) => b.localeCompare(a));
    return `<ol class="tl">${years.map(y => `<li><b>${y}</b><ul>${items.filter(i => i.y === y).map(i => `<li><span>${esc(i.kind)}</span><strong style="font-weight:500">${esc(i.title)}</strong><span>${esc(i.ev)}</span></li>`).join('')}</ul></li>`).join('')}</ol>`;
  }
  function guestsTable() {
    return `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:center"><p class="meta" style="margin:0">${esc(t('По умолчанию гостю ничего не открыто. Срок и отзыв действуют сразу, в том числе в уже открытой сессии.'))}</p>
      <button class="btn btn--sm" type="button" data-act="invite">${icon('plus')}${esc(t('Новое приглашение'))}</button></div>
      <div class="table-scroll"><table class="gtable"><thead><tr><th>${esc(t('Гость'))}</th><th>${esc(t('Статус'))}</th><th>${esc(t('Открыто'))}</th><th>${esc(t('Срок'))}</th><th></th></tr></thead><tbody>
      ${GUESTS.map(g => `<tr><td data-l="${esc(t('Гость'))}"><b>${esc(g.name)}</b><br><span class="meta">${esc(g.email)}</span></td><td data-l="${esc(t('Статус'))}">${esc(t(g.status))}</td>
        <td data-l="${esc(t('Открыто'))}">${g.access.length ? esc(g.access.join(', ')) : '—'}</td><td data-l="${esc(t('Срок'))}">${esc(g.until)}</td>
        <td><div class="row-act">${g.status === 'Доступ отозван' ? '' : `<button class="btn btn--sm btn--ghost" type="button" data-act="g-edit">${esc(t('Изменить'))}</button><button class="btn btn--sm btn--ghost" type="button" data-revoke="${g.id}">${esc(t('Отозвать'))}</button>`}</div></td></tr>`).join('')}
      </tbody></table></div>`;
  }

  App.route('vault', {
    access: 'owner', section: 'vault', title: 'Личный архив', keepScroll: true,
    render(p, q) {
      const tab = q.tab || 'items';
      const tabs = [['items', 'Материалы'], ['chrono', 'Хронология'], ['guests', 'Гости и приглашения']];
      return `${topBar()}<div class="wrap page">
        <header class="phead2"><p class="kicker">${esc(t('Только владелец'))}</p><h1 class="display">${esc(t('Личный архив'))}</h1>
          <p class="lead">${esc(t('Исходные, личные и архивные материалы. Новое по умолчанию видно только вам; расширить доступ можно только с подтверждением.'))}</p></header>
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${tab === k}" data-tab="${k}">${esc(t(l))}</button>`).join('')}</div>
        <div role="tabpanel">${tab === 'chrono' ? timeline() : tab === 'guests' ? guestsTable() : vaultList(q)}</div>
      </div>`;
    },
    mount(root, p, q) {
      const set = patch => App.go('#/vault?' + new URLSearchParams(Object.entries({ ...q, ...patch }).filter(([, v]) => v)).toString());
      root.addEventListener('click', e => {
        const tb = e.target.closest('[data-tab]'); if (tb) return set({ tab: tb.dataset.tab === 'items' ? '' : tb.dataset.tab, s: '', k: '' });
        const sh = e.target.closest('[data-share]'); if (sh) return confirmShare(VAULT.find(v => v.id === sh.dataset.share));
        const un = e.target.closest('[data-unshare]');
        if (un) { const v = VAULT.find(x => x.id === un.dataset.unshare); v.mode = 'owner'; v.guests = []; App.toast(t('Доступ закрыт: материал снова виден только вам')); return App.render({ keepScroll: true }); }
        const rv = e.target.closest('[data-revoke]');
        if (rv) { const g = GUESTS.find(x => x.id === rv.dataset.revoke); g.status = 'Доступ отозван'; g.access = []; g.until = '—'; App.toast(`${t('Доступ отозван')}: ${g.name}`); return App.render({ keepScroll: true }); }
        if (e.target.closest('[data-act="invite"]')) return inviteForm();
        if (e.target.closest('[data-act="g-edit"]')) return App.toast(t('Демо: здесь открывается редактор назначений гостя'));
        if (e.target.closest('[data-act="v-upload"]')) return App.toast(t('Демо: новый материал по умолчанию получает режим «Только владелец»'));
      });
      root.querySelectorAll('[data-vf]').forEach(s => s.addEventListener('change', () => set({ [s.dataset.vf]: s.value })));
    }
  });

  function confirmShare(v) {
    const m = App.modal(`<div class="confirm"><p class="kicker">${esc(t('Расширение доступа'))}</p><h2>«${esc(v.title)}»</h2>
      <div class="confirm__flow"><div><small>${esc(t('Сейчас'))}</small>${modeBadge('owner')}<p class="meta" style="margin:6px 0 0">${esc(t('Личный архив'))}</p></div>${icon('arrow-right')}
        <div><small>${esc(t('Будущая аудитория'))}</small><span data-future>${modeBadge('guest', ['guestA'])}</span></div></div>
      <form><fieldset style="border:0;padding:0;margin:0;display:grid;gap:10px"><legend class="kicker" style="margin-bottom:8px">${esc(t('Кому открыть'))}</legend>
        ${[['guestA', 'Гость А — Анна К.'], ['guestB', 'Гость Б — Борис Л.'], ['public', 'Публичная часть — все посетители']].map(([k, l], i) => `<label class="check"><input type="radio" name="to" value="${k}" ${i ? '' : 'checked'} style="border-radius:50%"><span>${esc(t(l))}</span></label>`).join('')}</fieldset>
        <label class="check"><input type="checkbox" name="copy" checked><span>${esc(t('Создать отдельную разрешённую версию — оригинал останется в архиве'))}</span></label>
        <p class="vnote" style="margin:0">${esc(t('Откроется только этот материал и выбранный файл. Остальные исходники, связанные материалы и архив остаются закрытыми. Перенос не запускает рассылку.'))}</p>
        <div class="confirm__actions"><button class="btn btn--pig" type="submit">${esc(t('Подтвердить расширение доступа'))}</button><button class="btn btn--ghost" type="button" data-act="modal-close">${esc(t('Отмена'))}</button></div></form></div>`,
      { label: t('Расширение доступа'), width: 620 });
    const form = m.el.querySelector('form'), fut = m.el.querySelector('[data-future]');
    form.addEventListener('change', () => { const to = form.to.value; fut.innerHTML = to === 'public' ? modeBadge('public') : modeBadge('guest', [to]); });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const to = form.to.value;
      v.mode = to === 'public' ? 'public' : 'guest'; v.guests = to === 'public' ? [] : [to];
      m.close(); App.toast(`${t('Доступ расширен')}: ${to === 'public' ? t('публичная часть') : guestName(to)}`);
      App.render({ keepScroll: true });
    });
  }
  function inviteForm() {
    const m = App.modal(`<div class="confirm"><p class="kicker">${esc(t('Персональное приглашение'))}</p><h2>${esc(t('Новое приглашение'))}</h2>
      <form><label class="field"><span>${esc(t('Получатель'))}</span><input class="input" name="n" required placeholder="${esc(t('Имя'))}"></label>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="e" required></label>
        <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
          <label class="field"><span>${esc(t('Ссылка активации действует'))}</span><select class="select"><option>3 ${esc(t('дня'))}</option><option selected>7 ${esc(t('дней'))}</option><option>14 ${esc(t('дней'))}</option></select></label>
          <label class="field"><span>${esc(t('Срок доступа'))}</span><select class="select"><option>${esc(t('Бессрочно'))}</option><option>1 ${esc(t('месяц'))}</option><option>6 ${esc(t('месяцев'))}</option><option>1 ${esc(t('год'))}</option></select></label></div>
        <fieldset class="inv-checks"><legend class="kicker" style="padding:0 6px">${esc(t('Разделы и альбомы'))}</legend>
          ${['Рабочий блог', ...ALBUMS.map(a => 'Альбом «' + a.title + '»')].map(x => `<label class="check"><input type="checkbox"><span>${esc(t(x))}</span></label>`).join('')}
          <p class="meta" style="margin:0">${esc(t('Ничего не отмечено — гостю ничего не откроется. Личный архив назначить нельзя.'))}</p></fieldset>
        <div class="confirm__actions"><button class="btn btn--pig" type="submit">${esc(t('Создать и отправить'))}</button><button class="btn btn--ghost" type="button" data-act="modal-close">${esc(t('Отмена'))}</button></div></form></div>`,
      { label: t('Новое приглашение'), width: 640 });
    m.el.querySelector('form').addEventListener('submit', e => {
      e.preventDefault(); if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      GUESTS.push({ id: 'g' + Date.now(), name: e.target.n.value, email: e.target.e.value.replace(/^(..).*(@.*)$/, '$1•••$2'), status: 'Приглашение отправлено', access: [], until: t('ссылка действует 7 дней') });
      m.close(); App.toast(t('Приглашение создано. Демо: письмо не отправляется')); App.render({ keepScroll: true });
    });
  }

  return { GUESTS, ALBUMS, VAULT };
})();

App.start();
</script>
</body>
</html>
