/* ============================================================
   Каталог: «Избранное и архив публикаций» и страница поиска
   (фильтры работают совместно, сброс, сортировка, страницы)
   ============================================================ */
const Catalog = (() => {
  const { esc, t, icon, glyph } = App;
  const W = () => window.Works;
  const PER = 8;
  const TYPE_ORDER = ['prose', 'poem', 'song', 'play', 'script', 'painting', 'album', 'video'];
  const LANG_NAME = { ru: 'Русский', en: 'English', fr: 'Français' };

  function facets() {
    const all = Search.items();
    const types = TYPE_ORDER.filter(tp => all.some(i => i.type === tp));
    const years = [...new Set(all.map(i => Search.decade(i.year)).filter(Boolean))].sort((a, b) => String(b).localeCompare(String(a)));
    const tagCount = new Map();
    all.forEach(i => i.tags.forEach(tg => tagCount.set(tg, (tagCount.get(tg) || 0) + 1)));
    const tags = [...tagCount].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ru')).slice(0, 30).map(x => x[0]).sort((a, b) => a.localeCompare(b, 'ru'));
    const langs = ['ru', 'en', 'fr'].filter(l => all.some(i => i.langs.includes(l)));
    return { types, years, tags, langs };
  }

  // для прозы ведём сразу в главу, где нашлись слова
  function chapterHit(it, q) {
    const w = it.ref, tk = Search.tokens(q);
    if (!tk.length || it.kind !== 'work' || !Array.isArray(w.chapters) || !W() || !W().chapterUrl) return null;
    const i = w.chapters.findIndex(ch => { const n = Search.norm(JSON.stringify(ch)); return tk.every(x => n.includes(x)); });
    if (i < 0 || w.chapters.length < 2) return null;
    const href = W().chapterUrl(w, i + 1);
    return { href: href + (href.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(q), label: `${t('Глава')} ${i + 1}${w.chapters[i].title ? ': «' + w.chapters[i].title + '»' : ''}` };
  }

  function resItem(it, q) {
    const ch = chapterHit(it, q);
    const langs = it.langs.length > 1 ? it.langs.map(l => l.toUpperCase()).join(' · ') : '';
    return `<li><a class="res__a" href="${esc(ch ? ch.href : it.url)}">
      <span class="res__thumb">${Pages.itemThumb(it, { ratio: '1/1' })}</span>
      <span><span class="res__meta"><span>${glyph(it.type)}${esc(it.typeLabel)}</span>${it.year ? `<span>${it.year}</span>` : ''}${langs ? `<span>${langs}</span>` : ''}${it.place ? `<span>${esc(it.place)}</span>` : ''}</span>
        <span class="res__t">${Search.mark(it.title, q)}</span>
        <span class="res__x">${Search.snippet(it, q)}</span>
        ${ch ? `<span class="res__ch">${icon('book', 'gl')} ${esc(ch.label)}</span>` : ''}</span>
      <span class="res__go">${icon('arrow-right')}</span></a></li>`;
  }

  function pager(base, f, page, pages) {
    if (pages < 2) return '';
    const link = n => `${base}?${qs({ ...f, page: n > 1 ? n : '' })}`;
    let out = '';
    if (page > 1) out += `<a href="${esc(link(page - 1))}" aria-label="${esc(t('Предыдущая страница'))}">${icon('arrow-left')}</a>`;
    for (let n = 1; n <= pages; n++) {
      if (n === 1 || n === pages || Math.abs(n - page) <= 1) out += n === page ? `<span aria-current="page">${n}</span>` : `<a href="${esc(link(n))}">${n}</a>`;
      else if (Math.abs(n - page) === 2) out += '<span class="gap">…</span>';
    }
    if (page < pages) out += `<a href="${esc(link(page + 1))}" aria-label="${esc(t('Следующая страница'))}">${icon('arrow-right')}</a>`;
    return `<nav class="pager" aria-label="${esc(t('Страницы'))}">${out}</nav>`;
  }
  const qs = o => Object.entries(o).filter(([, v]) => v !== '' && v != null).map(([k, v]) => `${k}=${encodeURIComponent(v)}`).join('&');

  function render({ base, q = '', f, mode }) {
    const fc = facets();
    const opts = (list, val, label, fmt = x => x) => `<option value="">${esc(t(label))}</option>` + list.map(x => `<option value="${esc(x)}" ${String(val) === String(x) ? 'selected' : ''}>${esc(fmt(x))}</option>`).join('');
    const sort = f.sort || (q ? 'rel' : 'date');
    let res = Search.run(q, { ...f, sort });
    let fixNote = '';
    if (q && !res.length) {
      const fix = Search.correct(q);
      if (fix) {
        const r2 = Search.run(fix, { ...f, sort });
        if (r2.length) {
          res = r2;
          fixNote = `<p class="cat__fix">${esc(t('По запросу'))} «${esc(q)}» ${esc(t('ничего не найдено. Показаны результаты по запросу'))} <a href="${esc(base)}?${qs({ ...f, q: fix, page: '' })}">«${esc(fix)}»</a>.</p>`;
          q = fix;
        }
      }
    }
    const active = ['type', 'lang', 'year', 'tag'].some(k => f[k]) || (mode === 'archive' && q);
    const bar = `<form class="cat__bar" data-form="catalog" data-base="${esc(base)}" role="search">
      <div class="cat__q"><label class="sr-only" for="cat-q">${esc(t(mode === 'search' ? 'Поиск по сайту' : 'Поиск по архиву'))}</label>
        <input class="input" id="cat-q" name="q" type="search" value="${esc(q)}" placeholder="${esc(t(mode === 'search' ? 'Слово, строка, название, место, год…' : 'Искать в архиве'))}">
        <button class="btn" type="submit">${icon('search')}<span>${esc(t('Найти'))}</span></button></div>
      <details class="cat__det" ${active ? 'open' : ''}><summary>${esc(t('Фильтры и сортировка'))}${icon('chev')}</summary><div class="cat__filters">
        <label class="field"><span>${esc(t('Тип'))}</span><select class="select" name="type">${opts(fc.types, f.type, 'Любой', x => Search.typeLabel(x))}</select></label>
        <label class="field"><span>${esc(t('Язык'))}</span><select class="select" name="lang">${opts(fc.langs, f.lang, 'Любой', x => LANG_NAME[x])}</select></label>
        <label class="field"><span>${esc(t('Год или период'))}</span><select class="select" name="year">${opts(fc.years, f.year, 'Любой')}</select></label>
        <label class="field"><span>${esc(t('Рубрика'))}</span><select class="select" name="tag">${opts(fc.tags, f.tag, 'Любая')}</select></label>
        <label class="field"><span>${esc(t('Сортировка'))}</span><select class="select" name="sort">${[q ? ['rel', 'По релевантности'] : null, ['date', 'Сначала новые'], ['alpha', 'По алфавиту'], ['year', 'По году создания']].filter(Boolean).map(([v, l]) => `<option value="${v}" ${sort === v ? 'selected' : ''}>${esc(t(l))}</option>`).join('')}</select></label>
        ${active ? `<a class="btn btn--ghost" href="${esc(base)}${mode === 'search' && q ? '?q=' + encodeURIComponent(q) : ''}">${icon('close')}${esc(t('Сбросить'))}</a>` : ''}
      </div></details></form>`;

    if (mode === 'search' && !q) {
      return bar + `<div class="empty" style="margin-top:28px">${glyph('poem')}<h2>${esc(t('Что ищем?'))}</h2><p>${esc(t('Например'))}: ${['степь', 'письмо', 'Волга', '2024', 'акварель'].map(x => `<a href="#/search?q=${encodeURIComponent(x)}">${esc(x)}</a>`).join(', ')}</p></div>`;
    }
    const total = res.length;
    let body = '';
    if (!total) {
      body = `<div class="empty" style="margin-top:28px">${glyph('poem')}<h2>${esc(t('Ничего не нашлось'))}</h2>
        <p>${esc(t('Попробуйте другое слово или уберите часть фильтров. Можно начать с разделов'))}: ${App.ART.map(([r, , l]) => `<a href="#/${r}">${esc(t(l))}</a>`).join(', ')}.</p></div>`;
    } else if (mode === 'search' && sort === 'rel' && !f.type) {
      const groups = TYPE_ORDER.map(tp => [tp, res.filter(r => r.type === tp)]).filter(([, l]) => l.length);
      body = groups.map(([tp, l]) => `<h3 class="cat__group-h">${esc(Search.typeLabel(tp, true))} · ${l.length}</h3><ul class="res">${l.slice(0, 5).map(it => resItem(it, q)).join('')}</ul>
        ${l.length > 5 ? `<p><a href="${esc(base)}?${qs({ ...f, q, type: tp })}">${esc(t('Показать все'))}: ${l.length} ${icon('arrow-right', 'gl')}</a></p>` : ''}`).join('');
    } else {
      const pages = Math.ceil(total / PER), page = Math.min(Math.max(1, Number(f.page) || 1), pages);
      body = `<ul class="res">${res.slice((page - 1) * PER, page * PER).map(it => resItem(it, q)).join('')}</ul>${pager(base, { ...f, q }, page, pages)}`;
    }
    const byType = TYPE_ORDER.map(tp => [tp, res.filter(r => r.type === tp).length]).filter(([, n]) => n);
    const chips = total && (mode === 'search' || q) ? `<div class="cat__groups" role="group" aria-label="${esc(t('Группы по типу'))}">
        <a class="tag ${!f.type ? 'is-on' : ''}" href="${esc(base)}?${qs({ ...f, q, type: '', page: '' })}">${esc(t('Все'))} <b>${total}</b></a>
        ${byType.map(([tp, n]) => `<a class="tag ${f.type === tp ? 'is-on' : ''}" href="${esc(base)}?${qs({ ...f, q, type: tp, page: '' })}">${esc(Search.typeLabel(tp, true))} <b>${n}</b></a>`).join('')}</div>` : '';
    return bar + fixNote + `<div class="cat__sum"><h2>${esc(t('Найдено'))}: ${total}</h2>${q ? `<span class="meta">${esc(t('Запрос'))}: «${esc(q)}»</span>` : ''}</div>` + chips + body;
  }

  function mount(root) {
    const form = root.querySelector('[data-form="catalog"]'); if (!form) return;
    const det = form.querySelector('.cat__det');
    if (det && matchMedia('(min-width: 900px)').matches) det.open = true;
    const base = form.dataset.base;
    const apply = () => {
      const d = Object.fromEntries(new FormData(form));
      App.go(`${base}?${qs({ q: (d.q || '').trim(), type: d.type, lang: d.lang, year: d.year, tag: d.tag, sort: d.sort })}`);
    };
    form.addEventListener('submit', e => { e.preventDefault(); e.stopPropagation(); apply(); });
    form.querySelectorAll('select').forEach(s => s.addEventListener('change', apply));
  }

  App.route('search', {
    section: 'search', keepScroll: true,
    title: (p, q) => q.q ? `${App.t('Поиск')}: ${q.q}` : 'Поиск',
    render(p, q) {
      return `<div class="wrap page">
        ${App.crumbs([{ label: t('Главная'), href: '#/' }, { label: t('Поиск') }])}
        <header class="page-head"><p class="kicker">${esc(t('Поиск по сайту'))}</p><h1 class="title">${q.q ? `«${esc(q.q)}»` : esc(t('Поиск'))}</h1>
          <p class="lead">${esc(t('Ищем по названиям и тексту, главам, первой строке стихотворения, описаниям, подписям, году, людям, месту и рубрикам.'))}</p></header>
        ${render({ base: '#/search', q: q.q || '', f: q, mode: 'search' })}
      </div>`;
    },
    mount
  });

  App.route('archive', {
    section: 'archive', keepScroll: true, title: 'Избранное и архив публикаций',
    render(p, q) {
      const fav = DATA.works.filter(w => w.featured).slice(0, 8);
      return `<div class="wrap page">
        ${App.crumbs([{ label: t('Главная'), href: '#/' }, { label: t('Избранное и архив') }])}
        <header class="page-head"><p class="kicker">${esc(t('Избранное и архив публикаций'))}</p><h1 class="title">${esc(t('Архив'))}</h1>
          <p class="lead">${esc(t('Сначала — то, что я выбрала сама. Ниже — все открытые публикации сайта с поиском и фильтрами.'))}</p></header>
        ${fav.length ? `<section aria-labelledby="fav-h"><div class="sec__head"><h2 class="section-title" id="fav-h">${esc(t('Избранное автора'))}</h2><p>${esc(t('Подборка, которую автор собирает вручную'))}</p></div>
          <div class="fav">${fav.map(w => `<a href="${esc(Pages.url(w))}">${Pages.thumb(w)}<h3>${esc(w.title)}</h3><p>${esc(Search.typeLabel(w.type))} · ${w.year || ''}</p></a>`).join('')}</div></section>` : ''}
        <section class="sec" id="all" aria-labelledby="all-h"><div class="sec__head"><h2 class="section-title" id="all-h">${esc(t('Все публикации'))}</h2><p>${esc(t('Только открытые материалы'))}</p></div>
          ${render({ base: '#/archive', q: q.q || '', f: q, mode: 'archive' })}</section>
      </div>`;
    },
    mount
  });

  return { render };
})();

    const access = App.isOwner() ? t('видны все материалы и режимы доступа')
      : `${t('вам открыто')}: ${GUESTS.find(g => g.id === r).access.join(', ')}`;
    return `<div class="closed-top"><div class="wrap"><span>${icon('lock')}<b>${esc(t('Закрытая часть · по приглашению'))}</b></span><span>${icon('user')}${esc(t(info.name))} — ${esc(access)}</span></div></div>`;
  }
  const ROLE_ACCESS = { blog: r => r === 'guestA' || r === 'owner' };
  const deniedHtml = () => App.isGuest() || App.isOwner() ? `<div class="nf">${glyph('script')}<h1>${esc(t('Нет доступа'))}</h1><p>${esc(t('Этот раздел не назначен вашей учётной записи.'))}</p><div class="nf__links"><a class="btn" href="#/albums">${esc(t('Мои альбомы'))}</a></div></div>` : null;

  /* ---------- рабочий блог ---------- */
  App.route('blog', {
    access: 'guest', section: 'blog', title: 'Рабочий блог',
    render(p, q) {
      if (!ROLE_ACCESS.blog(role())) return deniedHtml();
      const fmt = q.f || '';
      const list = ENTRIES.filter(e => (!e.draft || App.isOwner()) && (!fmt || e.format === fmt));
      return `${topBar()}<div class="wrap page">
        <header class="page-head"><p class="kicker">${esc(t('Закрытый блог'))}</p><h1 class="title">${esc(t('Рабочий блог'))}</h1>
          <p class="lead">${esc(t('Дневник руководителя: заметки о работе, команде, профессии, проектах, людях и встречах.'))}</p></header>
        <div class="chips" role="group" aria-label="${esc(t('Формат'))}" style="margin-bottom:28px"><a class="tag ${!fmt ? 'is-on' : ''}" href="#/blog">${esc(t('Все'))}</a>${FORMATS.map(f => `<a class="tag ${fmt === f ? 'is-on' : ''}" href="#/blog?f=${encodeURIComponent(f)}">${esc(t(f))}</a>`).join('')}</div>
        <div class="blog">
          <ol class="entries">${list.map(e => `<li class="entry ${e.format === 'Мысль дня' ? 'entry--quote' : ''}">
              <div class="entry__meta"><span class="entry__fmt">${esc(t(e.format))}</span><span>${App.fmtDate(e.date)}</span>${App.isOwner() ? (e.draft ? `<span class="mode mode--owner">${icon('lock')}${esc(t('Черновик · только владелец'))}</span>` : modeBadge('guest', ['guestA'])) : ''}</div>
              ${e.title ? `<h2>${esc(e.title)}</h2>` : ''}<p>${esc(e.text)}</p></li>`).join('') || `<li class="entry"><p>${esc(t('В этом формате пока нет записей.'))}</p></li>`}</ol>
          <aside style="display:grid;gap:18px;align-content:start">
            <div class="aside-card"><h2>${esc(t('Обо мне'))}</h2><p>${esc(t('Раздел заполняет владелец и сам решает, что показать приглашённым.'))}</p>
              <ul><li>${esc(t('Жизненный путь'))}</li><li>${esc(t('Карьера'))}</li><li>${esc(t('Личное кредо'))}</li><li>${esc(t('Текущая деятельность'))}</li></ul></div>
            <div class="aside-card"><h2>${esc(t('Как устроен доступ'))}</h2><p>${esc(t('Каждый гость видит только назначенные ему разделы и альбомы. Приглашение не открывает личный архив.'))}</p>
              <p style="margin:0">${esc(t('Кнопок «Поделиться» здесь нет: ссылка, открытая без прав, покажет нейтральный экран входа.'))}</p></div>
          </aside>
        </div></div>`;
    }
  });

  /* ---------- альбомы для приглашённых ---------- */
  App.route('albums', {
    access: 'guest', section: 'albums', title: 'Альбомы',
    render() {
      const vis = ALBUMS.filter(seesAlbum);
      const sections = [...new Set(vis.map(a => a.section))];
      return `${topBar()}<div class="wrap page">
        <header class="page-head"><p class="kicker">${esc(t('Закрытая часть'))}</p><h1 class="title">${esc(t('Альбомы'))}</h1>
          <p class="lead">${esc(App.isOwner() ? t('Все альбомы и права на них. Альбом может быть исключён из назначения, даже если гостю открыт весь раздел.') : t('Фотографии, которые владелец открыл для вас.'))}</p></header>
        ${sections.map(s => `<section class="sec" style="margin-top:0;margin-bottom:56px"><div class="sec__head"><h2 class="section-title">${esc(t(s))}</h2></div>
          <div class="albums">${vis.filter(a => a.section === s).map(a => `<button class="acard" type="button" data-calbum="${a.id}" style="border:0;background:none;padding:0;text-align:left;width:100%">
            <div class="acard__img">${Photo.svg(a.photos[0], { label: a.title })}<span class="acard__stack">${icon('image')}${a.photos.length}</span></div>
            <h3>${esc(a.title)}</h3><p>${a.year} · ${esc(a.place)}</p>
            ${App.isOwner() ? `<p style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">${a.audience.length ? modeBadge('guest', a.audience) : modeBadge('owner')}${a.excluded ? `<span class="mode">${esc(t('Исключён для'))}: ${esc(a.excluded.map(guestName).join(', '))}</span>` : ''}</p>` : ''}</button>`).join('')}</div></section>`).join('')}
      </div>`;
    },
    mount(root) {
      root.addEventListener('click', e => {
        const b = e.target.closest('[data-calbum]'); if (!b) return;
        const a = ALBUMS.find(x => x.id === b.dataset.calbum); if (a && seesAlbum(a)) Media.openPhoto(a, 0);
      });
    }
  });

  /* ---------- личный архив владельца ---------- */
  function vThumb(v) {
    if (v.scene) return Photo.svg(v, { w: 200, h: 200, label: v.title });
    return icon({ letter: 'mail', doc: 'doc', audio: 'sound', video: 'video' }[v.kind] || 'doc');
  }
  const KIND = { photo: 'Фото', letter: 'Письмо', doc: 'Документ', video: 'Видео', audio: 'Аудио' };
  function vaultList(q) {
    const sec = q.s || '', kind = q.k || '';
    const list = VAULT.filter(v => (!sec || v.section === sec) && (!kind || v.kind === kind));
    return `<div class="vfilters">
        <label class="field"><span>${esc(t('Раздел'))}</span><select class="select" data-vf="s"><option value="">${esc(t('Все'))}</option>${['Работа', 'Личное', 'Семья'].map(s => `<option ${s === sec ? 'selected' : ''}>${s}</option>`).join('')}</select></label>
        <label class="field"><span>${esc(t('Тип'))}</span><select class="select" data-vf="k"><option value="">${esc(t('Все'))}</option>${Object.entries(KIND).map(([k, l]) => `<option value="${k}" ${k === kind ? 'selected' : ''}>${esc(t(l))}</option>`).join('')}</select></label>
        <button class="btn btn--sm" type="button" data-act="v-upload">${icon('plus')}${esc(t('Добавить материал'))}</button></div>
      <ul class="vlist">${list.map(v => `<li class="vitem"><div class="vitem__thumb">${vThumb(v)}</div>
        <div><h3>${esc(v.title)}</h3><p>${esc(t(KIND[v.kind]))} · ${esc(App.fmtDate(v.date))} · ${esc(t(v.section))} · ${esc(v.event)}</p></div>
        <div class="vitem__mode">${modeBadge(v.mode, v.guests)}</div>
        <div class="vitem__act">${v.mode === 'owner' ? `<button class="btn btn--sm" type="button" data-share="${v.id}">${esc(t('Открыть доступ…'))}</button>` : `<button class="btn btn--sm btn--ghost" type="button" data-unshare="${v.id}">${esc(t('Закрыть доступ'))}</button>`}</div></li>`).join('')}</ul>`;
  }
  function timeline() {
    const items = [...VAULT.map(v => ({ y: String(v.date).slice(0, 4), d: v.date, title: v.title, kind: t(KIND[v.kind]), ev: v.event })),
      ...ALBUMS.map(a => ({ y: String(a.year), d: String(a.year), title: a.title, kind: t('Альбом'), ev: a.section }))];
    const years = [...new Set(items.map(i => i.y))].sort((a, b) => b.localeCompare(a));
    return `<ol class="tl">${years.map(y => `<li><b>${y}</b><ul>${items.filter(i => i.y === y).map(i => `<li><span>${esc(i.kind)}</span><strong style="font-weight:500">${esc(i.title)}</strong><span>${esc(i.ev)}</span></li>`).join('')}</ul></li>`).join('')}</ol>`;
  }
  function guestsTable() {
    return `<div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;align-items:center"><p class="meta" style="margin:0">${esc(t('По умолчанию гостю ничего не открыто. Срок и отзыв действуют сразу, в том числе в уже открытой сессии.'))}</p>
      <button class="btn btn--sm" type="button" data-act="invite">${icon('plus')}${esc(t('Новое приглашение'))}</button></div>
      <div class="table-scroll"><table class="gtable"><thead><tr><th>${esc(t('Гость'))}</th><th>${esc(t('Статус'))}</th><th>${esc(t('Открыто'))}</th><th>${esc(t('Срок'))}</th><th></th></tr></thead><tbody>
      ${GUESTS.map(g => `<tr><td data-l="${esc(t('Гость'))}"><b>${esc(g.name)}</b><br><span class="meta">${esc(g.email)}</span></td><td data-l="${esc(t('Статус'))}">${esc(t(g.status))}</td>
        <td data-l="${esc(t('Открыто'))}">${g.access.length ? esc(g.access.join(', ')) : '—'}</td><td data-l="${esc(t('Срок'))}">${esc(g.until)}</td>
        <td><div class="row-act">${g.status === 'Доступ отозван' ? '' : `<button class="btn btn--sm btn--ghost" type="button" data-act="g-edit">${esc(t('Изменить'))}</button><button class="btn btn--sm btn--ghost" type="button" data-revoke="${g.id}">${esc(t('Отозвать'))}</button>`}</div></td></tr>`).join('')}
      </tbody></table></div>`;
  }

  App.route('vault', {
    access: 'owner', section: 'vault', title: 'Личный архив', keepScroll: true,
    render(p, q) {
      const tab = q.tab || 'items';
      const tabs = [['items', 'Материалы'], ['chrono', 'Хронология'], ['guests', 'Гости и приглашения']];
      return `${topBar()}<div class="wrap page">
        <header class="page-head"><p class="kicker">${esc(t('Только владелец'))}</p><h1 class="title">${esc(t('Личный архив'))}</h1>
          <p class="lead">${esc(t('Исходные, личные и архивные материалы. Новое по умолчанию видно только вам; расширить доступ можно только с подтверждением.'))}</p></header>
        <div class="tabs" role="tablist">${tabs.map(([k, l]) => `<button type="button" role="tab" aria-selected="${tab === k}" data-tab="${k}">${esc(t(l))}</button>`).join('')}</div>
        <div role="tabpanel">${tab === 'chrono' ? timeline() : tab === 'guests' ? guestsTable() : vaultList(q)}</div>
      </div>`;
    },
    mount(root, p, q) {
      const set = patch => App.go('#/vault?' + new URLSearchParams(Object.entries({ ...q, ...patch }).filter(([, v]) => v)).toString());
      root.addEventListener('click', e => {
        const tb = e.target.closest('[data-tab]'); if (tb) return set({ tab: tb.dataset.tab === 'items' ? '' : tb.dataset.tab, s: '', k: '' });
        const sh = e.target.closest('[data-share]'); if (sh) return confirmShare(VAULT.find(v => v.id === sh.dataset.share));
        const un = e.target.closest('[data-unshare]');
        if (un) { const v = VAULT.find(x => x.id === un.dataset.unshare); v.mode = 'owner'; v.guests = []; App.toast(t('Доступ закрыт: материал снова виден только вам')); return App.render({ keepScroll: true }); }
        const rv = e.target.closest('[data-revoke]');
        if (rv) { const g = GUESTS.find(x => x.id === rv.dataset.revoke); g.status = 'Доступ отозван'; g.access = []; g.until = '—'; App.toast(`${t('Доступ отозван')}: ${g.name}`); return App.render({ keepScroll: true }); }
        if (e.target.closest('[data-act="invite"]')) return inviteForm();
        if (e.target.closest('[data-act="g-edit"]')) return App.toast(t('Демо: здесь открывается редактор назначений гостя'));
        if (e.target.closest('[data-act="v-upload"]')) return App.toast(t('Демо: новый материал по умолчанию получает режим «Только владелец»'));
      });
      root.querySelectorAll('[data-vf]').forEach(s => s.addEventListener('change', () => set({ [s.dataset.vf]: s.value })));
    }
  });

  function confirmShare(v) {
    const m = App.modal(`<div class="confirm"><p class="kicker">${esc(t('Расширение доступа'))}</p><h2>«${esc(v.title)}»</h2>
      <div class="confirm__flow"><div><small>${esc(t('Сейчас'))}</small>${modeBadge('owner')}<p class="meta" style="margin:6px 0 0">${esc(t('Личный архив'))}</p></div>${icon('arrow-right')}
        <div><small>${esc(t('Будущая аудитория'))}</small><span data-future>${modeBadge('guest', ['guestA'])}</span></div></div>
      <form><fieldset style="border:0;padding:0;margin:0;display:grid;gap:10px"><legend class="kicker" style="margin-bottom:8px">${esc(t('Кому открыть'))}</legend>
        ${[['guestA', 'Гость А — Анна К.'], ['guestB', 'Гость Б — Борис Л.'], ['public', 'Публичная часть — все посетители']].map(([k, l], i) => `<label class="check"><input type="radio" name="to" value="${k}" ${i ? '' : 'checked'} style="border-radius:50%"><span>${esc(t(l))}</span></label>`).join('')}</fieldset>
        <label class="check"><input type="checkbox" name="copy" checked><span>${esc(t('Создать отдельную разрешённую версию — оригинал останется в архиве'))}</span></label>
        <p class="notice" style="margin:0">${esc(t('Откроется только этот материал и выбранный файл. Остальные исходники, связанные материалы и архив остаются закрытыми. Перенос не запускает рассылку.'))}</p>
        <div class="confirm__actions"><button class="btn" type="submit">${esc(t('Подтвердить расширение доступа'))}</button><button class="btn btn--ghost" type="button" data-act="modal-close">${esc(t('Отмена'))}</button></div></form></div>`,
      { label: t('Расширение доступа'), width: 620 });
    const form = m.el.querySelector('form'), fut = m.el.querySelector('[data-future]');
    form.addEventListener('change', () => { const to = form.to.value; fut.innerHTML = to === 'public' ? modeBadge('public') : modeBadge('guest', [to]); });
    form.addEventListener('submit', e => {
      e.preventDefault();
      const to = form.to.value;
      v.mode = to === 'public' ? 'public' : 'guest'; v.guests = to === 'public' ? [] : [to];
      m.close(); App.toast(`${t('Доступ расширен')}: ${to === 'public' ? t('публичная часть') : guestName(to)}`);
      App.render({ keepScroll: true });
    });
  }
  function inviteForm() {
    const m = App.modal(`<div class="confirm"><p class="kicker">${esc(t('Персональное приглашение'))}</p><h2>${esc(t('Новое приглашение'))}</h2>
      <form><label class="field"><span>${esc(t('Получатель'))}</span><input class="input" name="n" required placeholder="${esc(t('Имя'))}"></label>
        <label class="field"><span>E-mail</span><input class="input" type="email" name="e" required></label>
        <div style="display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
          <label class="field"><span>${esc(t('Ссылка активации действует'))}</span><select class="select"><option>3 ${esc(t('дня'))}</option><option selected>7 ${esc(t('дней'))}</option><option>14 ${esc(t('дней'))}</option></select></label>
          <label class="field"><span>${esc(t('Срок доступа'))}</span><select class="select"><option>${esc(t('Бессрочно'))}</option><option>1 ${esc(t('месяц'))}</option><option>6 ${esc(t('месяцев'))}</option><option>1 ${esc(t('год'))}</option></select></label></div>
        <fieldset class="inv-checks"><legend class="kicker" style="padding:0 6px">${esc(t('Разделы и альбомы'))}</legend>
          ${['Рабочий блог', ...ALBUMS.map(a => 'Альбом «' + a.title + '»')].map(x => `<label class="check"><input type="checkbox"><span>${esc(t(x))}</span></label>`).join('')}
          <p class="meta" style="margin:0">${esc(t('Ничего не отмечено — гостю ничего не откроется. Личный архив назначить нельзя.'))}</p></fieldset>
        <div class="confirm__actions"><button class="btn" type="submit">${esc(t('Создать и отправить'))}</button><button class="btn btn--ghost" type="button" data-act="modal-close">${esc(t('Отмена'))}</button></div></form></div>`,
      { label: t('Новое приглашение'), width: 640 });
    m.el.querySelector('form').addEventListener('submit', e => {
      e.preventDefault(); if (!e.target.checkValidity()) { e.target.reportValidity(); return; }
      GUESTS.push({ id: 'g' + Date.now(), name: e.target.n.value, email: e.target.e.value.replace(/^(..).*(@.*)$/, '$1•••$2'), status: 'Приглашение отправлено', access: [], until: t('ссылка действует 7 дней') });
      m.close(); App.toast(t('Приглашение создано. Демо: письмо не отправляется')); App.render({ keepScroll: true });
    });
  }

  return { GUESTS, ALBUMS, VAULT };
})();

App.start();
</script>
</body>
</html>
