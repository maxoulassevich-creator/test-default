<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Каталог · SPA</title>
<style>
  body{margin:0;font-family:'EB Garamond',serif;background:#fff;color:#1d1d1d}
  .bar{position:fixed;top:0;left:0;right:0;height:64px;display:flex;align-items:center;gap:20px;padding:0 32px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);box-shadow:0 1px 0 #eee;z-index:10;transition:background .3s}
  .bar.scrolled{background:#222;color:#fff}
  .bar a{color:inherit;text-decoration:none}
  #view{padding:96px 32px 40px}
  h1{font-family:'Cormorant Garamond';font-size:40px;margin:0 0 12px}
  .list{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .item{border:1px solid #eee;border-radius:10px;padding:14px;min-height:80px}
  .pager a{margin-right:8px}
  form{display:grid;gap:10px;max-width:360px}
  input{padding:10px;border:1px solid #ccc;border-radius:8px;font:inherit}
  button{padding:10px 16px;border-radius:8px;border:0;background:#2b5;color:#fff;font:inherit}
  .err{color:#c33}
</style>
</head>
<body>
<div class="bar" id="bar"><b>Каталог</b><a href="#/">Главная</a><a href="#/items">Товары</a><a href="#/search?q=лампа">Поиск «лампа»</a><a href="#/search?q=стол">Поиск «стол»</a><a href="#/login">Вход</a><a href="#/login?mode=restore">Забыли пароль?</a><a href="#/old-catalog">Старый каталог</a><a href="#help">Помощь</a></div>
<main id="view"></main>
<script>
const items = Array.from({length: 30}, (_, i) => ({ id: i + 1, title: ['Лампа','Стол','Кресло','Полка'][i % 4] + ' ' + (i + 1) }));
const routes = {
  '': () => `<h1>Главная</h1><p>Добро пожаловать. <a href="#/items">Все товары</a>, <a href="#/item/1">первый товар</a>.</p><section id="help"><h2>Помощь</h2><p>Якорь на этой странице.</p></section>`,
  'items': (q) => { const page = +(q.get('page') || 1); const per = 8; const list = items.slice((page - 1) * per, page * per);
    return `<h1>Товары, страница ${page}</h1><div class="list">${list.map(i => `<a class="item" href="#/item/${i.id}">${i.title}</a>`).join('')}</div><p class="pager">${[1,2,3,4].map(p => `<a href="#/items?page=${p}">${p}</a>`).join('')}</p>`; },
  'item': (q, id) => { const it = items[+id - 1]; return it ? `<h1>${it.title}</h1><p>Карточка товара №${it.id}.</p><a href="#/item/${it.id % 30 + 1}">Следующий</a>` : `<h1>Не найдено</h1>`; },
  'search': (q) => { const s = q.get('q') || ''; const r = items.filter(i => i.title.toLowerCase().includes(s)); return `<h1>Поиск: «${s}»</h1><p>Найдено: ${r.length}</p><div class="list">${r.map(i => `<div class="item">${i.title}</div>`).join('')}</div>`; },
  'login': (q) => q.get('mode') === 'restore' ? `<h1>Восстановление пароля</h1><form onsubmit="return false"><input placeholder="E-mail"><button>Отправить ссылку</button></form>` : `<h1>Вход</h1><form onsubmit="return false"><input placeholder="Логин"><input type="password" value="secret"><button>Войти</button><p class="err">Демо: отправка отключена</p></form>`,
  'old-catalog': () => { location.replace('#/items'); return ''; },
};
function render() {
  const h = decodeURIComponent(location.hash.slice(1) || '/');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const name = parts[0] || '';
  const fn = routes[name];
  if (!fn && name && !/^[a-z]+$/i.test(name)) return;
  document.getElementById('view').innerHTML = fn ? fn(new URLSearchParams(qs || ''), parts[1]) : '<h1>404 · страница не найдена</h1><p><a href="#/">На главную</a></p>';
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
window.addEventListener('scroll', () => document.getElementById('bar').classList.toggle('scrolled', scrollY > 10));
render();
</script>
</body>
</html>
