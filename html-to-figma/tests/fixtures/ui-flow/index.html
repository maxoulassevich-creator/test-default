<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Мастерская</title>
<link rel="stylesheet" href="fonts.css">
<style>
  body{margin:0;font:18px/1.5 'EB Garamond',serif;color:#2c231f;background:#f7f3ed}
  header{display:flex;gap:24px;align-items:center;padding:20px 48px;border-bottom:1px solid #ddd2c4}
  header b{font:600 26px 'Cormorant Garamond',serif;margin-right:auto}
  header a{color:#6f5a50;text-decoration:none}
  main{padding:48px}
  h1{font:500 56px/1.1 'Cormorant Garamond',serif;margin:0 0 24px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
  .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 6px rgba(0,0,0,.08);transition:transform .3s,box-shadow .3s}
  .card svg{display:block;width:100%;height:160px;border-radius:12px}
  @media (hover:hover){.card:hover{transform:translateY(-6px) rotate(-1.5deg);box-shadow:0 20px 40px rgba(0,0,0,.18)}}
  .note{font-family:'Courier Prime','Cousine',monospace;font-size:14px}
</style>
</head>
<body>
<header><b>Мастерская</b><a href="index.html">Главная</a><a href="about.html">О мастерской</a></header>
<main>
  <h1>Акварель и свет</h1>
  <div class="grid">
    <div class="card"><svg viewBox="0 0 100 60"><rect width="100" height="60" fill="#c9d8e6"/><circle cx="70" cy="22" r="10" fill="#f2c46d"/></svg><h3>Утро</h3><p>Свет на воде.</p></div>
    <div class="card"><svg viewBox="0 0 100 60"><rect width="100" height="60" fill="#e7cfb8"/><path d="M0 45 Q50 25 100 45 V60 H0Z" fill="#9db08a"/></svg><h3>Степь</h3><p>Ветер и полынь.</p></div>
    <div class="card"><svg viewBox="0 0 100 60"><rect width="100" height="60" fill="#3b4a66"/><circle cx="30" cy="20" r="6" fill="#fff6d5"/></svg><h3>Ночь</h3><p>Окна напротив.</p></div>
  </div>
  <p class="note">Заметка: «Сценарий» — моноширинный шрифт.</p>
</main>
</body>
</html>
