<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Магазин</title>
<link rel="stylesheet" href="fonts.css">
<style>
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','EB Garamond',Roboto,sans-serif;color:#222;background:#fff}
  .t-menu{font-size:0;padding:20px 40px;background:#f3f3f3}
  .t-menu a{display:inline-block;font-size:16px;margin-right:24px;color:#333;text-decoration:none;word-spacing:2px}
  .t-store{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;padding:40px}
  .t-card{border:1px solid #eee;border-radius:12px;padding:16px}
  .t-card img{width:100%;height:180px;object-fit:cover;border-radius:8px}
  .t-name{font:600 20px 'Cormorant Garamond',serif;margin:12px 0 6px}
  .uc_prices{font-size:0}
  .uc_regular_price{display:inline-block;font:500 18px 'EB Garamond',serif;margin-right:10px}
  .uc_old_price{display:inline-block;font:400 15px 'EB Garamond',serif;color:#999;text-decoration:line-through;text-decoration-color:#e33;text-decoration-thickness:1.5px}
  .t-btn{display:inline-block;margin-top:12px;padding:10px 18px;border-radius:30px;background:#111;color:#fff;font:500 14px 'EB Garamond',serif;text-decoration:none}
  .filters{padding:0 40px 40px;font:16px 'EB Garamond',serif;word-spacing:3px}
  .filters label{margin-right:20px}
  .zero{font-size:0.5px;color:transparent}
</style></head>
<body>
<div class="t-menu"><a href="#">Каталог товаров</a><a href="#">Доставка и оплата</a><a href="#">Контакты</a></div>
<div class="filters"><label><input type="checkbox" checked> В наличии</label><label><input type="checkbox"> Со скидкой</label><label><input type="checkbox"> Новинки</label><span class="zero">скрытый текст</span></div>
<div class="t-store">
  <div class="t-card"><img src="img/item.png" alt=""><div class="t-name">Акварель «Степь»</div><div class="uc_prices"><span class="uc_regular_price">1 490,00 ₽</span><span class="uc_old_price">1 990,00 ₽</span></div><a class="t-btn" href="#">В корзину</a></div>
  <div class="t-card"><img src="img/item.png" alt=""><div class="t-name">Масло «Окна»</div><div class="uc_prices"><span class="uc_regular_price">2 300,00 ₽</span><span class="uc_old_price">2 900,00 ₽</span></div><a class="t-btn" href="#">В корзину</a></div>
  <div class="t-card"><img src="img/item.png" alt=""><div class="t-name">Эскиз «Сад»</div><div class="uc_prices"><span class="uc_regular_price">990,00 ₽</span></div><a class="t-btn" href="#">В корзину</a></div>
</div>
</body></html>
