<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HTML → Figma · обработчик</title>
<style>
body{font:14px/1.5 system-ui,"Segoe UI",sans-serif;max-width:820px;margin:24px auto;padding:0 16px;color:#1e1e1e;background:#fafafa}
h1{font-size:20px}section{background:#fff;border:1px solid #e3e3e3;border-radius:10px;padding:14px 16px;margin:12px 0}
button{font:inherit;padding:7px 12px;border-radius:7px;border:1px solid #ccc;background:#fff;cursor:pointer}button.primary{background:#0d99ff;color:#fff;border-color:#0d99ff}
input[type=text]{font:inherit;padding:6px;border:1px solid #ccc;border-radius:6px}
.muted{color:#666}.err{color:#c62828}ul{padding-left:18px}li{margin:2px 0}.hidden{display:none}
progress{width:100%}
</style>
</head>
<body>
<h1>HTML → Figma · локальный обработчик</h1>
<p class="muted">Резервный способ: подготовить пакет импорта здесь, в браузере, и открыть его в плагине кнопкой «Открыть пакет импорта». Основной способ — работать прямо из плагина в Figma.</p>
<section id="pair">
  <b>1. Код подключения</b> (показан в окне обработчика)<br>
  <input id="code" type="text" placeholder="XXXXX-XXXXX"> <button id="pairBtn">Подключить</button> <span id="pairState" class="muted"></span>
</section>
<section id="up" class="hidden">
  <b>2. HTML или ZIP</b><br>
  <input id="file" type="file" accept=".html,.htm,.zip"> <button id="go" class="primary">Анализировать</button>
  <div><progress id="prog" class="hidden" max="100" value="0"></progress> <span id="state" class="muted"></span></div>
</section>
<section id="list" class="hidden">
  <b>3. Страницы</b> <button id="all">Все</button> <button id="none">Ничего</button>
  <ul id="routes"></ul>
  <button id="cap" class="primary">Снять выбранные и скачать пакет</button>
</section>
<p id="err" class="err"></p>
<script src="/web.js"></script>
</body>
</html>
